name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Default to read-only; the publish job opts up to contents: write explicitly.
permissions:
  contents: read

jobs:
  # Unsigned build + tests for pull requests. No secrets are referenced here, so a PR
  # from a fork can never access signing material.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      # TEMPORARY (not for merge): list every executed unit test class + counts.
      - name: Unit test report
        run: |
          ./gradlew testReleaseUnitTest --rerun-tasks --stacktrace
          for f in app/build/test-results/testReleaseUnitTest/*.xml; do
            head -3 "$f" | tr -d '\n' | sed 's/.*<testsuite //; s/ timestamp=.*//'
            echo
          done

      - name: Assemble release APK (unsigned / debug-signed, no secrets)
        run: ./gradlew assembleRelease --stacktrace

      # H8: the build ran no lint task at any AGP version. lint's abortOnError
      # default means a genuine error fails the job.
      - name: Lint (release)
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Upload lint report (test job)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-pr
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn

      # H1: MapLibre merges ACCESS_FINE_LOCATION / ACCESS_WIFI_STATE into the shipped
      # manifest. They are stripped with tools:node="remove"; this proves it stayed
      # stripped in the artifact that actually ships.
      - name: Check merged manifest permissions
        run: ./scripts/check-merged-manifest.sh

      # TEMPORARY (not for merge): prove the B6 bundleRelease guard still fires under
      # AGP 9. This job has no keystore, so bundleRelease must fail with the guard's
      # message rather than producing a debug-signed AAB.
      - name: B6 guard must refuse a debug-signed bundle
        run: |
          if ./gradlew bundleRelease --stacktrace > /tmp/guard.log 2>&1; then
            echo "::error::bundleRelease SUCCEEDED without KEYSTORE_FILE - the B6 guard did not fire."
            tail -40 /tmp/guard.log
            exit 1
          fi
          if grep -q "Refusing to build a debug-signed Play bundle" /tmp/guard.log; then
            echo "B6 guard fired as expected:"
            grep -A3 "Refusing to build a debug-signed Play bundle" /tmp/guard.log | head -10
          else
            echo "::error::bundleRelease failed, but not because of the B6 guard."
            tail -60 /tmp/guard.log
            exit 1
          fi

  # Signed APK + AAB publish for pushes to master and version tags. Opts up to
  # contents: write so the tag job can create a GitHub Release.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # B6 fail-fast. All FOUR secrets matter: a present keystore with an empty alias is
      # a different, equally silent failure. On a tag this is fatal, because a tag build
      # is a release build; on other pushes it downgrades to a warning and skips the AAB
      # so forks without secrets can still build a sideload APK.
      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING=""
          for V in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!V}" ]; then MISSING="$MISSING $V"; fi
          done
          if [ -n "$MISSING" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Missing release signing secrets:$MISSING — refusing to build a tagged release."
              exit 1
            fi
            echo "::warning::Missing signing secrets:$MISSING — the Play AAB will be skipped and the APK will be debug-signed."
            echo "complete=false" >> "$GITHUB_OUTPUT"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.complete == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Exported once here so every Gradle step below picks it up; a per-step env:
          # ternary is easy to get subtly wrong in exactly the way B6 describes.
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      # versionCode must be strictly increasing and permanent. github.run_number is
      # neither: re-running a workflow reuses it (run_attempt is what increments), and
      # renaming the workflow file resets it to 1 — permanently unuploadable. Derive it
      # from the tag instead: v1.2.3 -> 1002003. run_number stays the fallback for
      # untagged master builds, which are never uploaded to Play.
      # (This must be a `run:` block: $(( )) inside a YAML env: value is passed
      # literally, toIntOrNull() returns null, and you ship versionCode 1.)
      - name: Derive version from tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            MAJOR="${V%%.*}"; REST="${V#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
            PATCH="${PATCH%%[-+]*}"
            CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
            echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
            echo "Tag-derived VERSION_NAME=$V VERSION_CODE=$CODE"
          else
            echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "Untagged build: VERSION_CODE=${GITHUB_RUN_NUMBER} (fallback, never uploaded to Play)"
          fi

      # No VERSION_CODE / KEYSTORE_FILE here: a step-level env: overrides $GITHUB_ENV and
      # would silently defeat both of the fixes above.
      - name: Assemble release APK (sideload)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Bundle release AAB (Play upload)
        if: steps.signing.outputs.complete == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      # B6 layer 3: prove the artifact about to be uploaded is signed by the real upload
      # key. A name check alone would not catch rotation to the wrong key.
      - name: Assert AAB signer
        if: steps.signing.outputs.complete == 'true'
        run: ./scripts/check-release-signer.sh app/build/outputs/bundle/release/app-release.aab

      # H1: fail the publish if a denylisted permission survived manifest merging into
      # the APK / AAB that is about to be uploaded.
      - name: Check merged manifest permissions
        run: ./scripts/check-merged-manifest.sh

      # H8: the build ran no lint task at any AGP version. lint's abortOnError
      # default means a genuine error fails the job.
      - name: Lint (release)
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Upload lint report (publish job)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ham-radio-wspr-txrx-${GITHUB_SHA::7}.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/ham-radio-wspr-txrx-${GITHUB_SHA::7}-play.aab"
          fi
          ls -l dist

      - name: Upload APK artifact (sideload)
        uses: actions/upload-artifact@v4
        with:
          name: ham-radio-wspr-txrx-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact (Play upload)
        if: steps.signing.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ham-radio-wspr-txrx-play-aab
          path: dist/*.aab
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
